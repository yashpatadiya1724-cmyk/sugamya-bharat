<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Accessibility Map – Sugamya Bharat</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <style>
    body { overflow: hidden; }
    .map-page { height: 100vh; display: flex; flex-direction: column; padding-top: 70px; }
    #map-container { flex: 1; position: relative; }
    #leaflet-map { width: 100%; height: 100%; }
    .map-sidebar {
      position: absolute;
      top: 0; right: 0;
      width: 360px;
      height: 100%;
      background: rgba(5,13,26,0.97);
      backdrop-filter: blur(20px);
      border-left: 1px solid var(--border);
      overflow-y: auto;
      transform: translateX(100%);
      transition: transform 0.3s ease;
      z-index: 500;
    }
    .map-sidebar.open { transform: translateX(0); }
    .sidebar-header {
      padding: 1.5rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }
    .sidebar-body { padding: 1.5rem; }
    .close-btn {
      background: none;
      border: none;
      color: var(--text-secondary);
      cursor: pointer;
      font-size: 1.2rem;
      padding: 4px;
    }
    .close-btn:hover { color: var(--text-primary); }
    .search-box {
      position: absolute;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      width: min(400px, calc(100% - 32px));
      z-index: 400;
    }
    .search-input {
      width: 100%;
      padding: 12px 20px 12px 44px;
      background: rgba(5,13,26,0.95);
      backdrop-filter: blur(10px);
      border: 1px solid var(--border);
      border-radius: 100px;
      color: var(--text-primary);
      font-family: 'Mukta',sans-serif;
      font-size: 0.9rem;
      outline: none;
      transition: var(--transition);
    }
    .search-input:focus { border-color: var(--saffron); }
    .search-input::placeholder { color: var(--text-muted); }
    .search-icon {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 1rem;
    }
    .map-legend {
      position: absolute;
      bottom: 40px;
      left: 16px;
      background: rgba(5,13,26,0.9);
      backdrop-filter: blur(10px);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 18px;
      z-index: 400;
    }
    .legend-title { font-size: 0.72rem; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--text-muted); margin-bottom: 10px; }
    .legend-row { display: flex; align-items: center; gap: 8px; font-size: 0.8rem; color: var(--text-secondary); margin-bottom: 6px; }
    .legend-dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; }
    .map-fab {
      position: absolute;
      bottom: 40px;
      right: 16px;
      z-index: 400;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .fab-btn {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      transition: var(--transition);
      box-shadow: 0 4px 16px rgba(0,0,0,0.4);
    }
    .fab-primary { background: linear-gradient(135deg, var(--saffron), var(--saffron-dark)); color: white; }
    .fab-secondary { background: rgba(5,13,26,0.95); border: 1px solid var(--border); color: var(--text-secondary); }
    .fab-btn:hover { transform: scale(1.1); }
    .score-feature {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 0;
      border-bottom: 1px solid rgba(255,255,255,0.04);
      font-size: 0.82rem;
    }
    .score-feature:last-child { border-bottom: none; }
    .score-feature .check { color: var(--fully-accessible); }
    .score-feature .cross { color: var(--not-accessible); }
    .verify-btn-group { display: flex; gap: 8px; margin-top: 1rem; }
    .popup-content { min-width: 220px; padding: 4px; }
    .popup-content .popup-title { font-family: 'Baloo 2', sans-serif; font-size: 1.05rem; font-weight: 700; margin-bottom: 4px; color: #F0F4FF; }
    .popup-content .popup-city { font-size: 0.75rem; color: #9AAAC8; margin-bottom: 8px; }
    .popup-content .popup-score-row { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
    .popup-content .popup-score-num { font-family: 'Baloo 2', sans-serif; font-size: 1.3rem; font-weight: 800; }
    .popup-content .popup-detail-btn {
      display: block;
      width: 100%;
      padding: 7px;
      background: rgba(255,153,51,0.15);
      border: 1px solid rgba(255,153,51,0.3);
      border-radius: 8px;
      color: #FF9933;
      font-size: 0.8rem;
      text-align: center;
      cursor: pointer;
      margin-top: 8px;
      font-family: 'Mukta', sans-serif;
      font-weight: 600;
      transition: all 0.2s;
    }
    .popup-content .popup-detail-btn:hover { background: rgba(255,153,51,0.25); }
    .filters-scroll {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 12px 16px;
      background: rgba(5,13,26,0.95);
      border-bottom: 1px solid var(--border);
    }
    .filters-scroll::-webkit-scrollbar { height: 3px; }
  </style>
</head>
<body>
<!-- Navbar -->
<nav class="navbar" id="navbar">
  <a href="index.html" class="nav-brand">
    <div class="nav-logo">♿</div>
    <div class="nav-title">
      <span>Sugamya Bharat</span>
      <span>Accessibility Map</span>
    </div>
  </a>
  <ul class="nav-links">
    <li><a href="index.html">🏠 Home</a></li>
    <li><a href="map.html" class="active">🗺️ Map</a></li>
    <li><a href="add-location.html">➕ Add</a></li>
    <li><a href="verify.html">✅ Verify</a></li>
    <li><a href="dashboard.html">📊 Dashboard</a></li>
  </ul>
  <div class="nav-cta" id="nav-auth">
    <a href="login.html" class="btn btn-secondary btn-sm">Login</a>
    <a href="register.html" class="btn btn-primary btn-sm">Register</a>
  </div>
</nav>

<div class="map-page">
  <!-- Filters -->
  <div class="filters-scroll">
    <button class="filter-btn active" data-filter="all">🌐 All</button>
    <button class="filter-btn" data-filter="wheelchair_ramp">🛤️ Ramps</button>
    <button class="filter-btn" data-filter="accessible_toilet">🚻 Toilets</button>
    <button class="filter-btn" data-filter="low_floor_bus">🚌 Low-Floor Bus</button>
    <button class="filter-btn" data-filter="metro_station">🚇 Metro</button>
    <button class="filter-btn" data-filter="elevator">🛗 Elevator</button>
    <button class="filter-btn" data-filter="accessible_parking">🅿️ Parking</button>
    <button class="filter-btn" data-filter="hospital">🏥 Hospital</button>
    <button class="filter-btn" data-filter="government_office">🏛️ Govt Office</button>
    <button class="filter-btn" data-filter="public_transport">🚉 Transport</button>
    <button class="filter-btn" data-filter="verified">✅ Verified Only</button>
  </div>

  <div id="map-container">
    <div id="leaflet-map"></div>

    <!-- Search -->
    <div class="search-box">
      <span class="search-icon">🔍</span>
      <input type="text" class="search-input" id="search-input" placeholder="Search city or location..." />
    </div>

    <!-- Legend -->
    <div class="map-legend">
      <div class="legend-title">Accessibility</div>
      <div class="legend-row"><div class="legend-dot" style="background:#00C853"></div> Fully Accessible</div>
      <div class="legend-row"><div class="legend-dot" style="background:#FFD600"></div> Partially Accessible</div>
      <div class="legend-row"><div class="legend-dot" style="background:#FF1744"></div> Not Accessible</div>
      <div class="legend-row"><div style="width:12px;height:12px;border-radius:3px;background:rgba(30,136,229,0.4);border:1px solid var(--blue-light);flex-shrink:0"></div> Verified ✓</div>
    </div>

    <!-- FABs -->
    <div class="map-fab">
      <button class="fab-btn fab-primary" onclick="window.location='add-location.html'" title="Add Location">➕</button>
      <button class="fab-btn fab-secondary" id="location-btn" title="My Location">📍</button>
      <button class="fab-btn fab-secondary" id="zoom-india-btn" title="Zoom to India">🇮🇳</button>
    </div>

    <!-- Sidebar -->
    <div class="map-sidebar" id="map-sidebar">
      <div class="sidebar-header">
        <div>
          <h3 id="sidebar-title" style="font-size:1.1rem;font-weight:700;margin-bottom:4px">Location Details</h3>
          <div id="sidebar-badges" style="display:flex;gap:6px;flex-wrap:wrap;margin-top:6px"></div>
        </div>
        <button class="close-btn" onclick="closeSidebar()">✕</button>
      </div>
      <div class="sidebar-body" id="sidebar-body">
        <p style="color:var(--text-muted);font-size:0.9rem">Click a marker to view details.</p>
      </div>
    </div>
  </div>
</div>

<div id="toast-container"></div>
<script src="js/auth.js"></script>
<script src="js/map.js"></script>
</body>
</html>
