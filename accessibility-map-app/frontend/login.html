<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login – Sugamya Bharat</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div class="auth-bg"></div>

<nav class="navbar">
  <a href="index.html" class="nav-brand">
    <div class="nav-logo">♿</div>
    <div class="nav-title"><span>Sugamya Bharat</span><span>Vikshit Bharat 2047</span></div>
  </a>
  <div></div>
  <div style="display:flex;gap:8px">
    <a href="index.html" class="btn btn-secondary btn-sm">← Home</a>
    <a href="register.html" class="btn btn-primary btn-sm">Register</a>
  </div>
</nav>

<div class="auth-page">
  <div class="auth-card fade-in">
    <div class="auth-header">
      <div class="auth-logo">♿</div>
      <h1 class="auth-title">Welcome Back</h1>
      <p class="auth-sub">Sign in to continue contributing</p>
    </div>

    <div id="error-msg" style="display:none;padding:10px 14px;background:rgba(255,23,68,0.1);border:1px solid rgba(255,23,68,0.3);border-radius:8px;color:var(--not-accessible);font-size:0.85rem;margin-bottom:1.2rem"></div>

    <form id="login-form">
      <div class="form-group">
        <label class="form-label">Email Address <span class="required">*</span></label>
        <input type="email" class="form-input" id="email" placeholder="you@example.com" required />
      </div>
      <div class="form-group">
        <label class="form-label">Password <span class="required">*</span></label>
        <div style="position:relative">
          <input type="password" class="form-input" id="password" placeholder="••••••••" required />
          <button type="button" onclick="togglePassword()" style="position:absolute;right:14px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--text-muted);cursor:pointer;font-size:1rem">👁</button>
        </div>
      </div>

      <button type="submit" class="btn btn-primary btn-lg" style="width:100%;justify-content:center" id="login-btn">
        Login to Sugamya Bharat
      </button>
    </form>

    <div class="form-divider"><span>or</span></div>

    <div style="text-align:center">
      <div style="margin-bottom:1rem">
        <button onclick="loginDemo('user')" class="btn btn-secondary btn-sm" style="margin:4px">👤 Demo User</button>
        <button onclick="loginDemo('admin')" class="btn btn-secondary btn-sm" style="margin:4px">⚙️ Demo Admin</button>
      </div>
      <p style="font-size:0.85rem;color:var(--text-muted)">
        Don't have an account? <a href="register.html" style="color:var(--saffron);text-decoration:none;font-weight:600">Register here →</a>
      </p>
    </div>

    <div style="margin-top:2rem;padding:1rem;background:rgba(255,153,51,0.05);border:1px solid rgba(255,153,51,0.1);border-radius:var(--radius-sm);text-align:center">
      <p style="font-size:0.75rem;color:var(--text-muted)">🔐 Demo credentials: <strong style="color:var(--saffron)">admin@sugamyabharat.in / Admin@123</strong></p>
      <p style="font-size:0.75rem;color:var(--text-muted);margin-top:4px">First time? Seed demo data at <code style="color:var(--blue-light)">/api/seed</code></p>
    </div>
  </div>
</div>

<div id="toast-container"></div>
<script src="js/auth.js"></script>
<script>
// Redirect if already logged in
if (isLoggedIn()) window.location = 'index.html';

document.getElementById('login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('login-btn');
  const errDiv = document.getElementById('error-msg');
  btn.innerHTML = '<span class="loader"></span> Signing in...';
  btn.disabled = true;
  errDiv.style.display = 'none';

  try {
    const res = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        email: document.getElementById('email').value,
        password: document.getElementById('password').value
      })
    });
    const data = await res.json();

    if (data.success) {
      saveAuth(data.token, data.user);
      showToast('✅ Welcome back, ' + data.user.name + '!', 'success');
      setTimeout(() => window.location = data.user.role === 'admin' ? 'admin.html' : 'map.html', 800);
    } else {
      errDiv.textContent = data.message;
      errDiv.style.display = 'block';
      btn.innerHTML = 'Login to Sugamya Bharat';
      btn.disabled = false;
    }
  } catch (err) {
    errDiv.textContent = 'Server error. Please check your connection.';
    errDiv.style.display = 'block';
    btn.innerHTML = 'Login to Sugamya Bharat';
    btn.disabled = false;
  }
});

function togglePassword() {
  const p = document.getElementById('password');
  p.type = p.type === 'password' ? 'text' : 'password';
}

function loginDemo(role) {
  if (role === 'admin') {
    document.getElementById('email').value = 'admin@sugamyabharat.in';
    document.getElementById('password').value = 'Admin@123';
  } else {
    document.getElementById('email').value = 'demo@sugamyabharat.in';
    document.getElementById('password').value = 'Demo@123';
  }
  document.getElementById('login-form').dispatchEvent(new Event('submit'));
}
</script>
</body>
</html>
